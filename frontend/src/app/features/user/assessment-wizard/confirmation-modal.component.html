<div class="modal-overlay" *ngIf="isOpen$ | async" (click)="closeModal()">
  <div class="modal-card" [ngClass]="type" (click)="$event.stopPropagation()">

    <button type="button" class="modal-close" aria-label="Close" (click)="closeModal()">×</button>

    <h3>{{ title }}</h3>
    <p>{{ message }}</p>

    <div class="modal-actions" *ngIf="buttons.length > 0">
      <button
        *ngFor="let btn of buttons"
        type="button"
        [ngClass]="getButtonClass(btn.class)"
        (click)="onButtonClick(btn.action)"
      >
        {{ btn.label }}
      </button>
    </div>

    <div class="modal-actions two-buttons" *ngIf="showTwoButtons && buttons.length === 0">
      <button type="button" class="btn-cancel" (click)="onCancel()">{{ cancelLabel }}</button>
      <button type="button" class="btn-confirm" [ngClass]="'btn-confirm-' + confirmButtonColor" (click)="onConfirm()">{{ confirmLabel }}</button>
    </div>

    <button type="button" class="btn-primary modal-action" (click)="closeModal()" *ngIf="!showTwoButtons && buttons.length === 0">OK</button>
  </div>
</div>
